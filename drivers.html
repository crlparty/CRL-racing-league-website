<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRL Drivers</title><link rel="stylesheet" href="styles.css"></head><body><header><a class="brand" href="index.html">CRL <span>Championship Racing League</span></a><nav><a href="index.html">Home</a><a href="results.html">Results</a><a href="records.html">Records</a></nav></header><main class="rulebook-page"><div class="rulebook-hero"><p class="eyebrow">CRL Competitors</p><h1>Drivers</h1><p class="rule-note">Search a driver and open their 2026 audited profile. Stats shown here are calculated only from verified site records.</p></div><article class="rulebook-content"><input id="driverSearch" type="search" placeholder="Search driver…"><div id="driverList" class="driver-grid"></div></article></main><script src="league-data.js"></script><script>
const wins={"CRL CHEVYMAN":2,"TWIZTIDS89T":2,"KROB24R":1,"IMBLOODYCROWLEY":1,"REDTOP1990":1,"BIGDADDYONEJR":2,"TATERTOT8188":1,"PURE BRAD54":3,"BLUBAHKA":1,"TURNERXGA":2};
const poles={"CRL CHEVYMAN":2,"TATERTOT8188":3,"TURNERXGA":3,"PURE BRAD54":3,"TWIZTIDS89T":1,"BLUBAHKA":1};
const fast={"IMBLOODYCROWLEY":1,"TATERTOT8188":2,"TURNERXGA":1,"BIGDADDYONEJR":1,"GHOSTTHERACE28":2,"PURE BRAD54":2,"REDTOP1990":1,"BLUBAHKA":2,"CRL PARTY":1};
const champs={"CRL CHEVYMAN":"Cup 2023, 2025 • O’Reilly 2023 • Truck 2023","CRL PARTY":"O’Reilly 2025 • Truck 2021, 2025","TURNERXGA":"Cup, O’Reilly & Truck 2026","GLIZDADDYSR":"O’Reilly 2024 • Truck 2024","TWIZTIDS89T":"Cup 2024"};
const all=[...new Set(Object.values(CRL_DATA.standings).flat().map(x=>x[0]).concat(Object.keys(wins),Object.keys(poles),Object.keys(fast),Object.keys(champs)))].sort();
const b=document.getElementById("driverList"),q=document.getElementById("driverSearch");
function points(name){return Object.entries(CRL_DATA.standings).filter(([s])=>true).map(([s,a])=>{const r=a.find(x=>x[0]===name);return r?'<p><b>'+({cup:"Cup",oreilly:"O’Reilly",trucks:"Trucks"}[s])+':</b> '+r[1]+' pts</p>':''}).join('')}
function draw(){const t=q.value.toLowerCase();b.innerHTML=all.filter(x=>x.toLowerCase().includes(t)).map(x=>'<details class="driver-card"><summary><h3>'+x+'</h3><span>Open profile</span></summary><div class="driver-stats">'+points(x)+'<p><b>Verified 2026 wins:</b> '+(wins[x]||0)+'</p><p><b>Verified poles:</b> '+(poles[x]||0)+'</p><p><b>Verified fastest laps:</b> '+(fast[x]||0)+'</p>'+(champs[x]?'<p><b>Championships:</b> '+champs[x]+'</p>':'')+'<a class="driver-results-link" href="results.html">View race archive →</a></div></details>').join("")}q.oninput=draw;draw();
</script></body></html>
