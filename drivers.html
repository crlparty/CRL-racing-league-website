<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRL Drivers</title><link rel="stylesheet" href="styles.css"></head><body><header><a class="brand" href="index.html">CRL <span>Championship Racing League</span></a><nav><a href="index.html">Home</a><a href="records.html">Records</a></nav></header><main class="rulebook-page"><div class="rulebook-hero"><p class="eyebrow">CRL Competitors</p><h1>Drivers</h1><p class="rule-note">Aliases are merged into one statistical identity. Search covers the current audited driver index.</p></div><article class="rulebook-content"><input id="driverSearch" type="search" placeholder="Search driver…"><div id="driverList" class="driver-grid"></div></article></main><script src="league-data.js"></script><script>const all=[...new Set(Object.values(CRL_DATA.standings).flat().map(x=>x[0]))].sort();const b=document.getElementById("driverList"),q=document.getElementById("driverSearch");function draw(){const t=q.value.toLowerCase();b.innerHTML=all.filter(x=>x.toLowerCase().includes(t)).map(x=>'<article class="driver-card"><h3>'+x+'</h3><p>2026 audited CRL competitor</p></article>').join("")}q.oninput=draw;draw();</script></body></html>
