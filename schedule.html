<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRL 2026 Schedule</title><link rel="stylesheet" href="styles.css"></head><body><header><a class="brand" href="index.html">CRL <span>Championship Racing League</span></a><nav><a href="index.html">Home</a><a href="rulebook.html">Rulebook</a><a href="records.html">Records</a></nav></header><main class="rulebook-page"><div class="rulebook-hero"><p class="eyebrow">2026 CRL Season</p><h1>Full Schedule</h1><p class="rule-note">The 2026 season keeps its 2026 label through the July 2027 finale.</p></div><article class="rulebook-content"><div class="tabs schedule-tabs"><button class="active" data-sched="cup">Cup</button><button data-sched="oreilly">O’Reilly</button><button data-sched="trucks">Trucks</button></div><div id="scheduleList" class="schedule-list"></div></article></main><script src="league-data.js"></script><script>const D=CRL_DATA;function renderSchedule(s="cup"){const b=document.getElementById("scheduleList"),now=new Date();b.innerHTML=D.schedules[s].map(e=>{const d=new Date(e[0]+"T20:30:00-05:00");return '<div class="sched-row '+(d<now?"past":"future")+'"><time>'+d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})+'</time><strong>'+e[1]+'</strong><span>'+e[2]+'</span></div>'}).join("")}document.querySelectorAll("[data-sched]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-sched]").forEach(x=>x.classList.remove("active"));b.classList.add("active");renderSchedule(b.dataset.sched)});renderSchedule();</script></body></html>
