function renderSchedule(series="cup"){
 const b=document.getElementById("scheduleList"),now=new Date();
 b.innerHTML=D.schedules[series].map(e=>{
  const d=new Date(e[0]+"T20:30:00-05:00"),r=recap[series+"|"+e[0]];
  if(!r)return '<div class="sched-row '+(d<now?"past":"future")+'"><time>'+d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})+'</time><strong>'+e[1]+'</strong><span>'+e[2]+'</span></div>';
  const top=r.top5?'<div class="recap-top5"><b>Top Finishers</b><ol>'+r.top5.map(x=>'<li>'+x+'</li>').join("")+'</ol></div>':"";
  return '<details class="schedule-race '+(d<now?"past":"future")+'"><summary><time>'+d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})+'</time><strong>'+e[1]+'</strong><span>Completed • View recap</span></summary><div class="schedule-recap"><div class="victory-placeholder"><span>Victory Lane graphic</span><small>Image will be added from the official CRL winner banner.</small></div><div class="recap-facts"><h3>'+r.winner+'</h3><p><b>Winner</b></p>'+(r.pole?'<p><b>Pole:</b> '+r.pole+'</p>':'')+(r.fast?'<p><b>Fastest Lap:</b> '+r.fast+'</p>':'')+top+'<a class="btn" href="results.html#'+r.id+'">View Full Results</a></div></div></details>';
 }).join("");
}
document.querySelectorAll("[data-sched]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-sched]").forEach(x=>x.classList.remove("active"));b.classList.add("active");renderSchedule(b.dataset.sched)});renderSchedule();
